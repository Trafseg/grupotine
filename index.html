<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#A41414"><meta name="robots" content="noindex,nofollow">
<title>Diagnóstico Gratuito | Grupo TINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--soft:#f7f5f5;--card:#ffffff;--border:#e2dede;--accent:#A41414;--accent-soft:rgba(164,20,20,.08);--text:#111111;--muted:#5f5b5b;--green:#25D366}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,#fff 0%,#faf3f3 100%);min-height:100svh;border-top:6px solid var(--accent)}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
[hidden]{display:none!important}
.shell{max-width:900px;margin:auto;padding:24px 28px;min-height:calc(100svh - 6px);display:flex;flex-direction:column}
.header{display:flex;align-items:center;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand img{width:120px;height:120px;object-fit:contain;display:block}
.brand-texto strong{display:block;font-size:16px;font-weight:700;letter-spacing:-.2px}
.brand-texto span{display:block;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-top:2px}
.label{margin-left:auto;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);border:1px solid rgba(164,20,20,.35);padding:8px 12px;border-radius:99px;font-weight:600;white-space:nowrap}
.form-headline{font-size:clamp(20px,3vw,28px);font-weight:800;text-align:center;margin:26px 0 0;line-height:1.3;letter-spacing:-.5px}
.accent{color:var(--accent)}
.progress-area{margin-top:22px}
.progress-meta{display:flex;justify-content:flex-end;font-size:11px;color:var(--muted);margin-bottom:8px}
.track{height:4px;background:var(--border);border-radius:10px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .35s}
main{flex:1;display:flex;align-items:center;padding:36px 0}
.screen{width:100%;max-width:640px;margin:auto;animation:enter .35s ease}
.step-label{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center}
.step-label b{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:var(--accent-soft);margin-right:8px}
h2{font-size:clamp(19px,2.6vw,27px);letter-spacing:-.8px;line-height:1.25;margin:16px 0 14px;font-weight:800}
h2:focus{outline:none}
.desc{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 20px}
.field{width:100%;background:transparent;border:0;border-bottom:2px solid var(--border);border-radius:0;padding:12px 0;color:var(--text);font-size:clamp(18px,2.6vw,24px);outline:none;transition:border-color .2s}
.field::placeholder{color:#a19c9c}
.field:focus{border-color:var(--accent)}
.field[aria-invalid=true]{border-color:var(--accent)}
.options{display:grid;gap:10px}
.option{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:13px;line-height:1.5;transition:border-color .2s,background .2s}
.option:hover{border-color:var(--accent)}
.option[aria-checked=true]{border-color:var(--accent);background:var(--accent-soft)}
.key{flex-shrink:0;border:1px solid #cfc8c8;border-radius:6px;width:26px;height:26px;display:grid;place-items:center;color:var(--accent);font-size:11px;font-weight:700}
.option[aria-checked=true] .key{background:var(--accent);color:#fff;border-color:var(--accent)}
.check{margin-left:auto;color:var(--accent);visibility:hidden}
.option[aria-checked=true] .check{visibility:visible}
.actions{display:flex;align-items:center;gap:16px;margin-top:22px}
.primary{display:inline-flex;justify-content:center;align-items:center;gap:10px;border:0;background:var(--accent);color:#fff;font-size:14px;font-weight:700;padding:15px 22px;border-radius:12px;text-decoration:none;transition:filter .2s;box-shadow:0 10px 24px rgba(164,20,20,.22)}
.primary:hover{filter:brightness(1.08)}
.primary.whats{background:var(--green);color:#072812;box-shadow:none}
.error{color:var(--accent);font-size:12px;min-height:18px;margin:10px 0 0}
.micro{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.6}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--border);padding-top:16px;margin-top:8px;color:var(--muted);font-size:10px;flex-wrap:wrap}
.back,.restart{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:8px 12px;font-size:11px}
.back:hover,.restart:hover{color:var(--accent);border-color:var(--accent)}
.thanks{text-align:center}
.thanks .step-label{justify-content:center}
.thanks .desc{max-width:520px;margin:0 auto 22px}
.thanks .primary{width:100%;max-width:420px}
.success{width:60px;height:60px;margin:0 auto 18px;display:grid;place-items:center;border-radius:16px;background:var(--accent-soft);border:1px solid rgba(164,20,20,.35);font-size:26px;color:var(--accent)}
.summary{text-align:left;background:var(--soft);border:1px solid var(--border);border-radius:14px;padding:18px;margin:22px 0}
.summary h3{font-size:12px;color:var(--accent);margin:0 0 10px}
.summary dl{margin:0}
.summary .row{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;line-height:1.5}
.summary .row:last-child{border:0}
.summary dt{color:var(--muted)}
.summary dd{margin:0;overflow-wrap:anywhere}
.restart{margin-top:6px}
.welcome{text-align:center;max-width:680px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(164,20,20,.3);background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:7px 13px;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.eyebrow:before{content:'';width:6px;height:6px;background:var(--accent);border-radius:50%}
.welcome h1{font-size:clamp(28px,4.4vw,44px);font-weight:800;letter-spacing:-1.4px;line-height:1.15;margin:20px 0 16px}
.welcome h1 span{color:var(--accent)}
.welcome .desc{max-width:540px;margin:0 auto 28px;font-size:14px}
.welcome .primary{font-size:15px;padding:16px 24px;border-radius:14px}
.welcome .micro{text-align:center}
.endereco{display:flex;align-items:center;gap:16px;max-width:580px;margin:36px auto 0;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:14px;padding:16px 18px;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.04)}
.endereco-icone{flex-shrink:0;width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.endereco-texto{min-width:0}
.endereco-titulo{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:600}
.endereco strong{display:block;font-size:15px;margin:4px 0}
.endereco small{display:block;font-size:12px;color:var(--muted);line-height:1.5}
.endereco-link{margin-left:auto;flex-shrink:0;border:1px solid var(--border);color:var(--accent);border-radius:10px;padding:9px 12px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
@media(max-width:560px){.endereco{flex-wrap:wrap}.endereco-link{margin-left:0}}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:560px){.shell{padding:18px 16px 22px}.brand img{width:90px;height:90px}.brand-texto{display:none}.label{display:none}.summary .row{grid-template-columns:100px 1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>

 {id:'property',resumo:'Imóvel',group:'Seu imóvel',title:'Qual tipo de imóvel você deseja proteger hoje?',options:['🏡 Casa ou Sobrado Residencial','🏢 Empresa, Comércio ou Galpão (CNPJ)','🏬 Condomínio Residencial ou Comercial (Síndico / Administradora)','🚜 Chácara, Sítio ou Área Rural']},
 {id:'situation',resumo:'Sistema atual',group:'Sua segurança hoje',title:'Você já possui algum sistema de segurança ou empresa no local?',options:['Não tenho nada instalado ainda.','Tenho equipamentos próprios, mas NÃO são monitorados 24h.','Já tenho empresa de monitoramento, mas estou insatisfeito com o serviço/preço.']},
 {id:'urgency',resumo:'Prazo',group:'Prazo do projeto',title:'Qual é o prazo em que você pretende implementar essa solução?',options:['Com urgência (mudei recentemente, estou em obra ou tive um incidente)','Nas próximas 2 a 3 semanas','Apenas pesquisando para um projeto futuro']}
];
const answers={};let step=-1;let autoAdvanceTimer=null;
const main=document.getElementById('main'),back=document.getElementById('back');
const perguntasAtivas=()=>questions.filter(q=>!q.when||q.when(answers));
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function focusTitle(){main.querySelector('h2')?.focus({preventScroll:true});window.scrollTo({top:0});}
function render(){
 clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null;
 const boasVindas=step===-1;
 document.getElementById('formHeadline').hidden=boasVindas;
 document.getElementById('progressArea').hidden=boasVindas;
 if(boasVindas){back.hidden=true;renderBoasVindas();focusTitle();return;}
 const lista=perguntasAtivas(),total=lista.length,finished=step>=total,completed=Math.min(step,total);
 const pct=Math.round(completed/total*100);
 document.getElementById('progressPercent').textContent=pct+'%';
 document.getElementById('fill').style.width=pct+'%';
 const barra=document.querySelector('[role=progressbar]');
 barra.setAttribute('aria-valuenow',completed);barra.setAttribute('aria-valuemax',total);
 back.hidden=step===0;
 if(finished)renderFinal(lista);else renderQuestion(lista[step]);
 focusTitle();
}
function renderBoasVindas(){
 main.innerHTML=`<section class="screen welcome"><div class="eyebrow">Segurança para condomínios e empresas</div><h1 tabindex="-1">Segurança inteligente para<br><span>o que você mais protege.</span></h1><p class="desc">Conte ao Grupo TINE o que você precisa proteger. Em 7 perguntas rápidas, você recebe uma estimativa personalizada.</p><button class="primary" id="iniciar" type="button">Iniciar diagnóstico gratuito <span aria-hidden="true">→</span></button><p class="micro">Poucas perguntas rápidas · Sem compromisso</p><div class="endereco"><div class="endereco-icone" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div><div class="endereco-texto"><span class="endereco-titulo">Grupo TINE · Jundiaí</span><strong>Estamos perto de você.</strong><small>Av. Francisco Pereira de Castro, 295, Jundiaí - SP, 13208-110</small></div><a class="endereco-link" href="https://www.google.com/maps/search/?api=1&amp;query=Av.+Francisco+Pereira+de+Castro%2C+295%2C+Jundiai+-+SP%2C+13208-110" target="_blank" rel="noopener noreferrer">Ver no mapa ↗</a></div></section>`;
 document.getElementById('iniciar').onclick=()=>{step=0;render();};
}
function renderQuestion(q){
 const corpo=q.options
  ?`<div class="options" role="radiogroup" aria-labelledby="questionTitle">${q.options.map((opcao,i)=>`<button type="button" class="option" role="radio" aria-checked="${answers[q.id]===opcao}" data-index="${i}" tabindex="${answers[q.id]===opcao||(!answers[q.id]&&i===0)?0:-1}"><span class="key" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${esc(opcao)}</span><span class="check" aria-hidden="true">✓</span></button>`).join('')}</div>`
  :`<input class="field" id="answer" aria-label="${esc(q.label)}" aria-describedby="description error" type="${q.type||'text'}" ${q.type==='tel'?'inputmode="tel"':''} autocomplete="${q.autocomplete}" maxlength="${q.type==='tel'?20:120}" placeholder="${esc(q.placeholder)}" value="${esc(answers[q.id])}" required>`;
 main.innerHTML=`<section class="screen"><div class="step-label"><b>${step+1}</b>${esc(q.group)}</div><h2 id="questionTitle" tabindex="-1">${esc(q.title)}</h2>${q.desc?`<p class="desc" id="description">${esc(q.desc)}</p>`:''}<form id="questionForm" novalidate>${corpo}<p class="error" id="error" role="alert"></p><div class="actions"><button class="primary" type="submit">${step===perguntasAtivas().length-1?'Concluir diagnóstico':'Continuar'} →</button></div></form></section>`;
 if(q.options){
  main.querySelectorAll('.option').forEach(botao=>botao.onclick=()=>selectOption(Number(botao.dataset.index)));
 }else{
  const input=document.getElementById('answer');
  input.addEventListener('input',()=>{answers[q.id]=input.value;input.removeAttribute('aria-invalid');document.getElementById('error').textContent='';});
  if(q.type==='tel')input.addEventListener('input',()=>{
   let digits=input.value.replace(/\D/g,'');
   if(digits.startsWith('55')&&digits.length>11)digits=digits.slice(2);
   digits=digits.slice(0,11);
   input.value=digits.length>2?'('+digits.slice(0,2)+') '+digits.slice(2,digits.length>10?7:6)+(digits.length>6?'-'+digits.slice(digits.length>10?7:6):''):digits;
   answers[q.id]=input.value;
  });
 }
 document.getElementById('questionForm').onsubmit=evento=>{evento.preventDefault();advance();};
}
function selectOption(index){
 const q=perguntasAtivas()[step];
 if(!q?.options?.[index])return;
 answers[q.id]=q.options[index];
 main.querySelectorAll('.option').forEach((botao,i)=>{botao.setAttribute('aria-checked',i===index);botao.tabIndex=i===index?0:-1;});
 document.getElementById('error').textContent='';
 clearTimeout(autoAdvanceTimer);
 const etapaSelecionada=step;
 autoAdvanceTimer=setTimeout(()=>{autoAdvanceTimer=null;if(step===etapaSelecionada)advance();},400);
}
function advance(){
 const q=perguntasAtivas()[step];
 const value=(answers[q.id]||'').trim();
 let error='';
 if(!value)error=q.options?'Selecione uma opção para continuar.':'Preencha este campo para continuar.';
 else if(q.id==='name'&&value.split(/\s+/).length<2)error='Informe seu nome completo, com nome e sobrenome.';
 else if(q.id==='phone'&&!/^[1-9]{2}\d{8,9}$/.test(value.replace(/\D/g,'')))error='Informe um número válido com DDD (10 ou 11 dígitos).';
 else if(q.id==='location'&&value.length<4)error='Informe o bairro e a cidade do imóvel.';
 if(error){
  document.getElementById('error').textContent=error;
  const input=document.getElementById('answer');
  if(input){input.setAttribute('aria-invalid','true');input.focus();}
  return;
 }
 answers[q.id]=value;
 step++;
 render();
}
function renderFinal(lista){
 const rows=lista.filter(q=>q.resumo&&answers[q.id]).map(q=>[q.resumo,answers[q.id]]);
 const message='Olá, Grupo TINE! Fiz o diagnóstico no site e gostaria de receber uma estimativa.\n\n'+rows.map(([label,valor])=>label+': '+valor).join('\n');
 const waLink=(WHATSAPP_NUMERO?'https://wa.me/'+WHATSAPP_NUMERO:'https://wa.me/')+'?text='+encodeURIComponent(message);
 const digitosLead=(answers.phone||'').replace(/\D/g,'');
 const leadWaLink=digitosLead?'https://wa.me/55'+digitosLead:'';
 if(PLANILHA_WEBHOOK){
  const dados={};
  lista.forEach(q=>dados[q.id]=answers[q.id]||'');
  fetch(PLANILHA_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...dados,whatsappLink:leadWaLink})}).catch(()=>{});
 }
 const primeiroNome=answers.name.trim().split(/\s+/)[0];
 main.innerHTML=`<section class="screen thanks"><div class="success" aria-hidden="true">✓</div><div class="step-label">Tudo pronto para o próximo passo</div><h2 tabindex="-1">Diagnóstico concluído, ${esc(primeiroNome)}!</h2><p class="desc">Analisamos as melhores opções de segurança para o seu imóvel. Clique abaixo para receber sua estimativa no WhatsApp com um dos nossos consultores.</p><a class="primary whats" id="whatsapp" href="${esc(waLink)}" target="_blank" rel="noopener noreferrer">Falar agora com o Grupo TINE no WhatsApp</a><p class="micro">O atendimento começa após você enviar a mensagem no WhatsApp.</p><div class="summary"><h3>CONFIRA SUAS RESPOSTAS</h3><dl>${rows.map(([label,valor])=>`<div class="row"><dt>${esc(label)}</dt><dd>${esc(valor)}</dd></div>`).join('')}</dl></div><button class="restart" id="restart" type="button">Recomeçar diagnóstico</button></section>`;
 document.getElementById('restart').onclick=()=>{for(const chave of Object.keys(answers))delete answers[chave];step=-1;render();};
}
back.onclick=()=>{if(step>0){step--;render();}};

document.addEventListener('keydown',evento=>{
 if(evento.ctrlKey||evento.altKey||evento.metaKey||evento.target.matches('input,textarea'))return;
 const q=perguntasAtivas()[step];
 if(!q?.options)return;
 const tecla=evento.key.toUpperCase();
 if(/^[A-D]$/.test(tecla)){
  const index=tecla.charCodeAt(0)-65;
  if(index<q.options.length){evento.preventDefault();selectOption(index);}
 }
});
render();
</script>
</body>
</html>
